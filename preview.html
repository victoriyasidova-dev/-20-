<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Вишиванка Апокаліпсис</title>
<style>
body {
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
    overflow:hidden;
}
#orderBtn {
    margin-top:120px;
    padding:25px 60px;
    font-size:32px;
    font-weight:bold;
    color:white;
    background:red;
    border:none;
    border-radius:12px;
    cursor:pointer;
}
#message {
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}
#vyshyvanka {
    margin-top:40px;
    max-width:400px;
}
#bottomImg {
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:120px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}
.cat, .bomb {
    position:fixed;
    width:120px;
    cursor:pointer;
}
@keyframes rainbow {
    0%{color:red;}14%{color:orange;}28%{color:yellow;}42%{color:green;}57%{color:blue;}71%{color:indigo;}85%{color:violet;}100%{color:red;}
}
.rainbowText{animation: rainbow 1s linear infinite;}
</style>
</head>
<body>

<button id="orderBtn">ЗАМОВИТИ</button>
<div id="message"></div>

<img id="vyshyvanka" src="https://images.prom.ua/4295739555_w640_h2048_zhinocha_vishivanka_merez__vono_chornij_ornament.jpg?fresh=1&PIMAGE_ID=4295739555">
<img id="bottomImg" src="https://static.wikitide.net/houkai2ndwiki/1/1d/Akemi_Homura_Awaken.png">

<audio id="song" src="https://cdn.muzyet.com/?h=JGraYpdVSDIUwqGGultj4LMzj89YUpa7RMWEbHoe5j88X-VckGN-CxS4epHLVCD5kh-KvYJeTspDupF8f_jVkVpbl2CQYYBKHsh6fsRfXizPL4c"></audio>
<audio id="meow" src="https://www.soundjay.com/animal/cat-meow-1.mp3"></audio>

<script>
const btn=document.getElementById("orderBtn");
const msg=document.getElementById("message");
const song=document.getElementById("song");
const meowSound=document.getElementById("meow");
const cats=[];
const bombs=[];
let btnClicks=0;
let bombDestroyed=0;
let apocalypseStarted=false;

// --- Кнопка ---
btn.onclick=()=>{
    btnClicks++;
    song.currentTime=0;
    song.play();
    if(btnClicks<5){
        msg.innerText="Очікуйте на вашу вишиванку у продовж невизначеного періоду часу, дякую за покупку";
    }else{
        msg.innerHTML='<span class="rainbowText">I AM THE BEST</span>';
    }
};

// --- Котики ---
function createCat(x=200,y=200){
    const cat=document.createElement("img");
    cat.src="https://png.pngtree.com/png-clipart/20230512/original/pngtree-isolated-cat-on-white-background-png-image_9158356.png";
    cat.classList.add("cat");
    document.body.appendChild(cat);
    cat.style.left=x+"px";
    cat.style.top=y+"px";
    let dx=Math.random()*4+2;
    let dy=Math.random()*4+2;
    if(Math.random()>0.5) dx*=-1;
    if(Math.random()>0.5) dy*=-1;
    cat.dataset.dx=dx;
    cat.dataset.dy=dy;
    cat.onclick=()=>{
        meowSound.currentTime=0;
        meowSound.play();
        createCat(parseInt(cat.style.left)+30,parseInt(cat.style.top)+30);
        if(cats.length>20 && !apocalypseStarted){
            startApocalypse();
        }
    }
    cats.push(cat);
}

// --- Бомби ---
function createBomb(x,y){
    const bomb=document.createElement("img");
    bomb.src="https://static.wikitide.net/cafewiki/4/4b/CatBombModel.png";
    bomb.classList.add("bomb");
    document.body.appendChild(bomb);
    bomb.style.left=x+"px";
    bomb.style.top=y+"px";
    let dx=Math.random()*3+1;
    let dy=Math.random()*3+1;
    if(Math.random()>0.5) dx*=-1;
    if(Math.random()>0.5) dy*=-1;
    bomb.dataset.dx=dx;
    bomb.dataset.dy=dy;
    bomb.onclick=()=>{
        bomb.src="https://www.vecteezy.com/png/58281341-vibrant-pink-cloud-explosion-with-dynamic-energy-and-texture-cut-out";
        setTimeout(()=>{
            bomb.remove();
            bombDestroyed++;
            if(bombDestroyed>=bombs.length){
                victory();
            }
        },3000);
    }
    bombs.push(bomb);
}

// --- Початкові котики ---
for(let i=0;i<5;i++) createCat();

// --- Початкові бомби з'являться після апокаліпсису ---
function startApocalypse(){
    apocalypseStarted=true;
    document.body.style.background="url('https://i.pinimg.com/1200x/7a/db/27/7adb272c1aeace803b84c40b26b2ce89.jpg') center/cover no-repeat";
    msg.innerHTML='<span class="rainbowText">Коти захопили світ!!!!!!!!!</span>';
    for(let i=0;i<10;i++){
        createBomb(Math.random()*window.innerWidth, Math.random()*window.innerHeight);
    }
}

// --- Перемога ---
function victory(){
    cats.forEach(cat=>cat.remove());
    bombs.forEach(bomb=>bomb.remove());
    cats.length=0; bombs.length=0;
    
    document.body.innerHTML="";
    const victoryMsg=document.createElement("div");
    victoryMsg.style.textAlign="center";
    victoryMsg.style.marginTop="50px";
    victoryMsg.innerHTML=`
        <span class="rainbowText" style="font-size:36px;">ВИ ПЕРЕМОГЛИ КОТІВ</span><br>
        <img src="https://i.pinimg.com/736x/26/c7/35/26c7355fe46f62d84579857c6f8c4ea5.jpg" style="max-width:90%; margin-top:20px;">
    `;
    document.body.appendChild(victoryMsg);
    
    // Один котик по центру
    createCat(window.innerWidth/2-60, window.innerHeight/2-60);
    document.body.style.background="#000";
}

// --- Рух всіх об'єктів ---
function moveObjects(){
    [...cats,...bombs].forEach(obj=>{
        let x=parseFloat(obj.style.left);
        let y=parseFloat(obj.style.top);
        let dx=parseFloat(obj.dataset.dx);
        let dy=parseFloat(obj.dataset.dy);
        x+=dx; y+=dy;
        if(x+obj.width>window.innerWidth || x<0) dx*=-1;
        if(y+obj.height>window.innerHeight || y<0) dy*=-1;
        obj.style.left=x+"px";
        obj.style.top=y+"px";
        obj.dataset.dx=dx;
        obj.dataset.dy=dy;
    });
    requestAnimationFrame(moveObjects);
}
moveObjects();
</script>

</body>
</html>
